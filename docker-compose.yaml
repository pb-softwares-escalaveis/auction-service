name: kafka-connect-script-stack
services:
  auction-service:
    image: pedrovncs/auction-service:latest
    container_name: auction-service-app
    ports:
      - "${AUCTION_SERVICE_PORT:-8080}:8080"
    environment:
      AUCTION_SERVICE_S3_ENDPOINT: ${AUCTION_SERVICE_S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: us-east-fake
      AUCTION_SERVICE_S3_BUCKET_NAME: ${AUCTION_SERVICE_S3_BUCKET_NAME}

      AUCTION_SERVICE_POSTGRES_USER: ${AUCTION_SERVICE_POSTGRES_USER}
      AUCTION_SERVICE_POSTGRES_PASSWORD: ${AUCTION_SERVICE_POSTGRES_PASSWORD}
      AUCTION_SERVICE_POSTGRES_HOST: auction-service-postgres

      AUCTION_SERVICE_PORT: ${AUCTION_SERVICE_PORT}

      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    depends_on:
      auction-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - leilao-network

  eureka-server:
    container_name: eureka-server
    image: steeltoeoss/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - leilao-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kafka:
    image: apache/kafka:4.3.0
    container_name: leilao-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - leilao-kafka-data:/var/lib/kafka/data
    networks:
      - leilao-network
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
      ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/topics.txt:/config/topics.txt
      - ./config/create-topics.sh:/config/create-topics.sh
    networks:
      - leilao-network
    entrypoint: ["/bin/sh", "/config/create-topics.sh"]

  auction-postgres:
    image: postgres:15-alpine
    container_name: auction-service-postgres
    environment:
      POSTGRES_USER: ${AUCTION_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUCTION_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${AUCTION_SERVICE_POSTGRES_PORT}:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=1"
      - "-c"
      - "max_replication_slots=1"
    volumes:
      - ./docker:/docker-entrypoint-initdb.d/
    networks:
      - leilao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUCTION_SERVICE_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: auction-kafka-connect
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: auction-connect-cluster
      CONFIG_STORAGE_TOPIC: auction_connect_configs
      OFFSET_STORAGE_TOPIC: auction_connect_offsets
      STATUS_STORAGE_TOPIC: auction_connect_statuses
      
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auction-postgres:
        condition: service_healthy
    networks:
      - leilao-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: auction-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./config/postgres_config.json:/config/postgres_config.json:ro
      - ./config/register-connector.sh:/config/register-connector.sh:ro
    networks:
      - leilao-network
    entrypoint: ["/bin/sh", "/config/register-connector.sh"]

volumes:
  leilao-kafka-data:

networks:
  leilao-network:
    external: true
