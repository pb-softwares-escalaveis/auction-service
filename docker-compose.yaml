services:
  postgres:
    image: postgres:latest
    container_name: auction-service-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  kafka:
      image: apache/kafka:4.1.0
      container_name: oleiloeiro-kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller

        KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      volumes:
        - oleiloeiro-kafka-data:/var/lib/kafka/data
      healthcheck:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
        interval: 10s
        timeout: 10s
        retries: 10

  kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: oleiloeiro-kafka-ui
        depends_on:
          kafka:
            condition: service_healthy
        ports:
          - "8090:8080"
        environment:
          KAFKA_CLUSTERS_0_NAME: oleiloeiro-local
          KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  oleiloeiro-kafka-data: